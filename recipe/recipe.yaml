schema_version: 1

context:
  name: blackrenderer
  version: "0.8.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/blackrenderer-${{ version }}.tar.gz
  sha256: 13c97569c4b05c0e9f7c4e85af4f4a8ac9c3e76bd6a43e2c5307b4df25ac11c6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - blackrenderer=blackrenderer.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools-scm
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - fonttools >=4.62.1
    - uharfbuzz >=0.53.2

tests:
  - python:
      imports:
        - blackrenderer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - blackrenderer --help

about:
  summary: A Python-based renderer for OpenType COLRv1 fonts, with multiple backends.
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: https://github.com/BlackFoundryCom/black-renderer

extra:
  recipe-maintainers:
    - thewchan
