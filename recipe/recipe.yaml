schema_version: 1

context:
  name: blackrenderer
  version: "0.8.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/blackrenderer-${{ version }}.tar.gz
  sha256: 32d1d875b61ac13ccbe75128aa308943d2d8a40ce95d77f9d64930ed8978d509

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - blackrenderer=blackrenderer.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools-scm
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - fonttools >=4.34.0
    - uharfbuzz >=0.16.0

tests:
  - python:
      imports:
        - blackrenderer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - blackrenderer --help

about:
  summary: A Python-based renderer for OpenType COLRv1 fonts, with multiple backends.
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: https://github.com/BlackFoundryCom/black-renderer

extra:
  recipe-maintainers:
    - thewchan
